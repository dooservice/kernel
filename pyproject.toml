[project]
name = "dooservice-kernel"
version = "0.1.0"
description = "A kernel for modular FastAPI services: modules, their configuration, events, database and migrations"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136",
    "pydantic>=2.13",
    "email-validator>=2.2",
    "msgspec>=0.21",
    "tortoise-orm>=1.1",
    "aiosqlite>=0.22",
    "itsdangerous>=2.2",
    "bcrypt>=5",
    "pynacl>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dooservice_kernel"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "basedpyright>=1.39",
    "ruff>=0.15",
    "httpx>=0.28",
]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = ["--import-mode=importlib"]
