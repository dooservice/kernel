[project]
name = "dooservice-kernel"
version = "0.4.0"
description = "A kernel for modular FastAPI services: modules, their configuration, events, database and migrations"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.136",
    "pydantic>=2.13",
    "email-validator>=2.2",
    "msgspec>=0.21",
    "tortoise-orm>=1.1",
    "aiosqlite>=0.22",
    "itsdangerous>=2.2",
    "bcrypt>=5",
    "pynacl>=1.6",
    "cyclopts>=4.22",
]

[project.urls]
Homepage   = "https://dooservice.sh"
Repository = "https://github.com/dooservice/kernel"

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
metrics = ["prometheus-client>=0.21"]
tracing = ["opentelemetry-instrumentation-fastapi>=0.50b0"]
redis = ["redis>=5.2"]
testing = ["httpx>=0.28", "pytest>=9"]

[project.entry-points.pytest11]
dooservice_kernel = "dooservice_kernel.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dooservice_kernel"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "basedpyright>=1.39",
    "ruff>=0.15",
    "httpx>=0.28",
]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = ["--import-mode=importlib"]
pythonpath   = ["tests"]
