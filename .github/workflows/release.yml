name: Release Kernel

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Types
        run: uv run basedpyright src

      - name: Tests
        run: uv run pytest -q

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.tag.outputs.version }}"
          body: |
            ${{ steps.changelog.outputs.body }}

            ---

            ## Using this release

            In the `[tool.uv.sources]` of an application built on the kernel:

            ```toml
            dooservice-kernel = { git = "https://github.com/dooservice/kernel", tag = "${{ steps.tag.outputs.version }}" }
            ```
