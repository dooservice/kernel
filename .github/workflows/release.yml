name: Release Kernel

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: kernel
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      KERNEL_TEST_POSTGRES: postgresql://postgres:kernel@127.0.0.1:5432
      KERNEL_TEST_REDIS: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint, format, types and tests
        run: make check

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ steps.tag.outputs.version }}"
          body: |
            ${{ steps.changelog.outputs.body }}

            ---

            ## Using this release

            In the `[tool.uv.sources]` of an application built on the kernel:

            ```toml
            dooservice-kernel = { git = "https://github.com/dooservice/kernel", tag = "${{ steps.tag.outputs.version }}" }
            ```
